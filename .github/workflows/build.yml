name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Smoke test
        run: |
          BIN="$(swift build -c release --show-bin-path)/agent-display"
          "$BIN" help
          "$BIN" list
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | "$BIN" mcp
